name: Release

on:
  push:
    tags: ['v*']
  # Two modes from the Actions tab:
  #   publish=false (default) — dry run: validate, build the zip, upload it as
  #     a workflow artifact, publish nothing. Exercises the release path
  #     without spending a tag.
  #   publish=true — cut the release. The version comes from manifest.json and
  #     the tag is created here, so the two cannot disagree by construction —
  #     the mismatch the tag-push path exists to catch is impossible.
  workflow_dispatch:
    inputs:
      publish:
        description: Actually publish a release (otherwise just a dry run)
        type: boolean
        default: false

permissions:
  contents: read

env:
  MOD_FOLDER: GOTTA_BIKE_Sauce_Lunatic

jobs:
  # Same job CI runs on main and on PRs -- manifest, JS syntax, asset refs.
  # A tag that fails it never reaches the publish step.
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the "tag is on main" check needs real history

      - name: Resolve version
        id: ver
        run: |
          MANIFEST=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")

          if [ "$GITHUB_REF_TYPE" != tag ]; then
            if [ "${{ inputs.publish }}" != "true" ]; then
              echo "Dry run from $GITHUB_REF_NAME: building $MANIFEST, publishing nothing."
              echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Publishing from a branch. The version is read from the manifest
            # rather than typed, so there is nothing to mistype and nothing to
            # mismatch; the tag is created below.
            if git ls-remote --exit-code --tags origin "v$MANIFEST" >/dev/null 2>&1; then
              echo "::error::v$MANIFEST already exists. Bump the version in manifest.json first — a released tag is never moved."
              exit 1
            fi
            echo "Publishing v$MANIFEST from $GITHUB_REF_NAME."
            echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "createTag=true" >> "$GITHUB_OUTPUT"
            echo "checkMain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${GITHUB_REF_NAME#v}"
          BASE="${TAG%%-*}"   # v0.2.0-rc1 -> 0.2.0, so a pre-release shares the manifest version
          echo "tag=$TAG base=$BASE manifest=$MANIFEST"

          # Catch a malformed tag BEFORE comparing versions. The glob trigger is
          # `v*`, so a typo like `v.0.3.0` still starts a run, and comparing it
          # to the manifest produces a version-mismatch error that sends you off
          # bumping the manifest when the real problem is the tag name.
          if ! printf '%s' "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version tag. Expected vMAJOR.MINOR.PATCH, or vMAJOR.MINOR.PATCH-suffix for a pre-release — for example v0.3.0 or v0.3.0-rc1. Delete this tag and re-tag."
            exit 1
          fi

          if [ "$BASE" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG does not match manifest.json version $MANIFEST. Bump the manifest and re-tag."
            exit 1
          fi

          # The zip keeps the full tag, so an -rc build is never mistaken for
          # the release it is a candidate for.
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ "$BASE" != "$TAG" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "checkMain=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Full releases must be on main
        if: steps.ver.outputs.checkMain == 'true'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME is not an ancestor of main. Tag a merged commit, or use a -rc suffix to publish it as a pre-release."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"

      - name: Create the tag
        if: steps.ver.outputs.createTag == 'true'
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"
          echo "Tagged v$V at $(git rev-parse --short HEAD)"

      - name: Build mod zip
        run: |
          V="${{ steps.ver.outputs.version }}"
          OUT="build/$MOD_FOLDER"
          mkdir -p "$OUT"
          cp manifest.json "$OUT/"
          cp -r pages "$OUT/"
          [ -f LICENSE ] && cp LICENSE "$OUT/"
          find "$OUT" -name '.DS_Store' -delete
          cd build && zip -qr "${MOD_FOLDER}_${V}.zip" "$MOD_FOLDER"
          ls -lh *.zip

      - name: Upload dry-run zip
        if: steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_FOLDER }}_${{ steps.ver.outputs.version }}
          path: build/*.zip

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: build/*.zip
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          body: |
            ## Install

            1. Download the zip below.
            2. Unzip it into `~/Documents/SauceMods/` (macOS) so you have
               `SauceMods/GOTTA_BIKE_Sauce_Lunatic/manifest.json`.
            3. Restart Sauce4Zwift and enable the mod, then open the
               **Lunatic Announcer** window.

            ## Pick a provider

            On the **AI Provider** tab, choose one of:

            - **Lunatic hosted** - no API key, a monthly allowance of free calls.
            - **Anthropic** - your own key, billed to your account.
            - **OpenAI-compatible** - OpenAI, Google Gemini, OpenRouter, Groq,
              or a local Ollama.

            Whichever you choose, rider data leaves your machine: the names,
            power and heart rate of riders around you are sent to that service.

            Spoken commentary is **off by default** - enable it with the
            speaker button in the window titlebar.
